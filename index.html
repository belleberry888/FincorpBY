<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClientFlow CRM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

/* Login Page */
.login-wrap{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
.login-card{
    width:420px;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 4px 20px #00000015;
}
.login-card h2{margin-top:0}
.login-card input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #dce1e8;
    border-radius:8px;
    font-size:14px;
}
.lang-switch-login{
    margin-top:10px;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 230px;
    height: 100vh;
    background: #111827;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 25px 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    padding: 0 12px 30px;
}

.logo span {
    color: #7c83ff;
}

.menu button {
    width: 100%;
    border: none;
    background: transparent;
    color: #b8c0ce;
    padding: 13px 14px;
    margin-bottom: 5px;
    border-radius: 9px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.menu button:hover,
.menu button.active {
    background: #252d3d;
    color: white;
}

/* ================= MAIN ================= */

.main {
    margin-left: 230px;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap:wrap;
    gap:10px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 6px 0 0;
    color: #737d90;
    font-size: 14px;
}

.btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 11px 17px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
.btn-danger{
    background:#c12f3e;
}
.btn-danger:hover{
    background:#a02430;
}
.btn-lang{
    background:#334155;
}
.btn:hover {
    background: #4338ca;
}

/* ================= DASHBOARD CARDS ================= */

.cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 13px;
    padding: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.04);
}

.card-title {
    color: #737d90;
    font-size: 12px;
}

.card-number {
    font-size: 27px;
    font-weight: bold;
    margin-top: 8px;
}

/* ================= CONTENT ================= */

.content {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 13px;
    overflow: hidden;
}

.toolbar {
    padding: 16px;
    border-bottom: 1px solid #e5e8ef;
    display: flex;
    gap: 10px;
    flex-wrap:wrap;
}

.search {
    width: 300px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.select {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
}

/* ================= TABLE ================= */

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px 17px;
    border-bottom: 1px solid #edf0f4;
    text-align: left;
    font-size: 13px;
}

th {
    color: #737d90;
    font-size: 11px;
    text-transform: uppercase;
}

.customer-name {
    font-weight: bold;
}

.small {
    color: #737d90;
    font-size: 11px;
    margin-top: 4px;
}

/* ================= STATUS ================= */

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.New {
    background: #eef2ff;
    color: #4f46e5;
}

.Contacted {
    background: #f0f3f6;
    color: #536174;
}

.Pending,
.DocumentPending {
    background: #fff5df;
    color: #b76b00;
}

.Review,
.UnderReview {
    background: #eaf6ff;
    color: #1475aa;
}

.Approved {
    background: #e8f8f0;
    color: #12805e;
}

.Rejected {
    background: #ffedef;
    color: #c12f3e;
}

.Disbursed {
    background: #e5f8ef;
    color: #08774e;
}

/* ================= MODAL ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: white;
    width: 720px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 25px;
    border-radius: 15px;
}

.modal-box h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #dce1e8;
    border-radius: 8px;
    font-size: 14px;
}

.form-group textarea {
    min-height: 90px;
}

.full {
    grid-column: 1 / -1;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.cancel {
    background: #eef0f4;
    color: #333;
}

/* ================= PROFILE ================= */

.profile {
    display: none;
}

.profile.active {
    display: block;
}

.back {
    border: none;
    background: transparent;
    color: #4f46e5;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}

.profile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.section {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 13px;
    padding: 20px;
    margin-bottom: 16px;
}

.section h3 {
    margin-top: 0;
}

.details {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 10px;
    font-size: 13px;
}

.details b {
    color: #737d90;
}

.timeline {
    border-left: 2px solid #e4e7ec;
    padding-left: 20px;
    margin-left: 5px;
}

.timeline-item {
    margin-bottom: 20px;
    position: relative;
}

.timeline-item:before {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    background: #4f46e5;
    border-radius: 50%;
    left: -26px;
    top: 4px;
}

.application-card {
    border: 1px solid #e3e7ee;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
    background: #fafbff;
}

.application-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.application-info {
    display: flex;
    gap: 30px;
    margin-top: 15px;
    font-size: 13px;
}

.application-info div {
    min-width: 100px;
}

.application-info small {
    color: #737d90;
}

/* ================= RESPONSIVE ================= */

@media(max-width: 950px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width: 700px) {

    .sidebar {
        width: 65px;
    }

    .logo {
        font-size: 0;
    }

    .logo span {
        font-size: 20px;
    }

    .menu button {
        font-size: 0;
        text-align: center;
    }

    .main {
        margin-left: 65px;
        padding: 18px;
    }

    .form-grid,
    .profile-grid {
        grid-template-columns: 1fr;
    }

    .cards {
        grid-template-columns: 1fr 1fr;
    }

    .toolbar {
        flex-direction: column;
    }

    .search {
        width: 100%;
    }

}
</style>
</head>


<body>
<!-- Login Page -->
<div id="loginPage" class="login-wrap">
    <div class="login-card">
        <h2 data-i18n="loginTitle">Staff Login ClientFlow CRM</h2>
        <input type="text" id="loginUser" data-i18n-placeholder="userPlaceholder" placeholder="Staff Account">
        <input type="password" id="loginPwd" data-i18n-placeholder="pwdPlaceholder" placeholder="Password">
        <button class="btn" onclick="doLogin()" data-i18n="loginBtn">Login</button>
        <p style="margin:10px 0;color:#666" data-i18n="testAcc">Test account: staff | Password:123456</p>
        <div class="lang-switch-login">
            <button class="btn btn-lang" onclick="switchLang()">中文 / English</button>
        </div>
    </div>
</div>

<!-- ================= SIDEBAR ================= -->
<div id="crmPage" style="display:none;">
<div class="sidebar">

    <div class="logo">
        Client<span>Flow</span>
    </div>

    <div class="menu">

        <button class="active" onclick="dashboardPage(this)" data-i18n="menuDashboard">
            📊 Dashboard
        </button>

        <button onclick="customersPage(this)" data-i18n="menuCustomer">
            👥 Customers
        </button>

        <button onclick="loanTypesPage(this)" data-i18n="menuLoan">
            💰 Loan Types
        </button>

        <button onclick="applicationsPage(this)" data-i18n="menuApp">
            📄 Applications
        </button>

        <button onclick="followupPage(this)" data-i18n="menuFollow">
            📅 Follow Up
        </button>

        <button onclick="reportsPage(this)" data-i18n="menuReport">
            📈 Reports
        </button>

    </div>

</div>


<!-- ================= MAIN ================= -->

<div class="main">

<!-- DASHBOARD -->

<div id="dashboardPage">

    <div class="header">

        <div>
            <h1 data-i18n="dashTitle">Dashboard</h1>
            <p data-i18n="dashSub">Client overview and application progress</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
            <button class="btn btn-lang" onclick="switchLang()">中文 / English</button>
            <button class="btn" onclick="openCustomerModal()" data-i18n="addCustomerBtn">
                + Add Customer
            </button>
            <button class="btn btn-danger" onclick="logout()" data-i18n="logoutBtn">Logout</button>
        </div>

    </div>


    <div class="cards">

        <div class="card">
            <div class="card-title" data-i18n="totalCus">TOTAL CUSTOMERS</div>
            <div class="card-number" id="totalCustomers">0</div>
        </div>

        <div class="card">
            <div class="card-title" data-i18n="newLead">NEW LEADS</div>
            <div class="card-number" id="newLeads">0</div>
        </div>

        <div class="card">
            <div class="card-title" data-i18n="pendingDoc">PENDING DOCUMENTS</div>
            <div class="card-number" id="pendingDocs">0</div>
        </div>

        <div class="card">
            <div class="card-title" data-i18n="appr">APPROVED</div>
            <div class="card-number" id="approved">0</div>
        </div>

        <div class="card">
            <div class="card-title" data-i18n="disb">DISBURSED</div>
            <div class="card-number" id="disbursed">0</div>
        </div>

    </div>


    <div class="content">

        <div class="toolbar">

            <input
                class="search"
                id="search"
                data-i18n-placeholder="searchPh"
                placeholder="Search customer name / phone..."
                oninput="renderCustomers()"
            >

            <select
                class="select"
                id="statusFilter"
                onchange="renderCustomers()"
            >

                <option value="" data-i18n="allStatus">All Status</option>
                <option>New</option>
                <option>Contacted</option>
                <option>Pending</option>
                <option>Review</option>
                <option>Approved</option>
                <option>Rejected</option>
                <option>Disbursed</option>

            </select>

        </div>


        <table>

            <thead>

                <tr>
                    <th data-i18n="colCus">Customer</th>
                    <th data-i18n="colPhone">Phone</th>
                    <th data-i18n="colLoan">Loan Type</th>
                    <th data-i18n="colAmt">Amount</th>
                    <th data-i18n="colStat">Status</th>
                    <th data-i18n="colUpdate">Updated</th>
                    <th data-i18n="colAct">Action</th>
                </tr>

            </thead>

            <tbody id="customerTable"></tbody>

        </table>

    </div>

</div>


<!-- PROFILE -->

<div id="profilePage" class="profile"></div>

</div>


<!-- ================= CUSTOMER MODAL ================= -->

<div class="modal" id="customerModal">

<div class="modal-box">

<h2 data-i18n="modalAddCus">Add Customer</h2>

<form id="customerForm">

<div class="form-grid">

<div class="form-group">
<label data-i18n="lblName">Full Name</label>
<input id="customerName" required>
</div>

<div class="form-group">
<label data-i18n="lblPhone">Phone</label>
<input id="customerPhone" required>
</div>

<div class="form-group">
<label data-i18n="lblEmail">Email</label>
<input id="customerEmail">
</div>

<div class="form-group">
<label data-i18n="lblIC">IC / Passport</label>
<input id="customerIC">
</div>

<div class="form-group">
<label data-i18n="lblDOB">Date of Birth</label>
<input id="customerDOB" type="date">
</div>

<div class="form-group">
<label data-i18n="lblJob">Occupation</label>
<input id="customerJob">
</div>

<div class="form-group">
<label data-i18n="lblCompany">Company</label>
<input id="customerCompany">
</div>

<div class="form-group">
<label data-i18n="lblIncome">Monthly Income (RM)</label>
<input id="customerIncome" type="number">
</div>

<div class="form-group">
<label data-i18n="lblLoanType">Loan Type</label>

<select id="customerLoanType">

<option>Personal Loan</option>
<option>Debt Consolidation</option>
<option>Housing Loan</option>
<option>Car Loan</option>
<option>Business Loan</option>
<option>Credit Card</option>
<option>Refinancing</option>
<option>Other</option>

</select>

</div>

<div class="form-group">
<label data-i18n="lblLoanAmt">Loan Amount (RM)</label>
<input id="customerAmount" type="number">
</div>

<div class="form-group">

<label data-i18n="lblStatus">Status</label>

<select id="customerStatus">

<option>New</option>
<option>Contacted</option>
<option>Pending</option>
<option>Review</option>
<option>Approved</option>
<option>Rejected</option>
<option>Disbursed</option>

</select>

</div>

<div class="form-group full">

<label data-i18n="lblNote">Notes</label>

<textarea id="customerNotes"></textarea>

</div>

</div>


<div class="modal-actions">

<button
type="button"
class="btn cancel"
onclick="closeCustomerModal()" data-i18n="btnCancel">

Cancel

</button>

<button class="btn" data-i18n="btnSave">

Save Customer

</button>

</div>

</form>

</div>

</div>


<!-- ================= APPLICATION MODAL ================= -->

<div class="modal" id="applicationModal">

<div class="modal-box">

<h2 data-i18n="modalAddApp">Add Loan Application</h2>

<form id="applicationForm">

<div class="form-grid">

<div class="form-group">

<label data-i18n="lblCusSel">Customer</label>

<select id="applicationCustomer" required></select>

</div>


<div class="form-group">

<label data-i18n="lblLoanTy">Loan Type</label>

<select id="applicationLoanType">

<option>Personal Loan</option>
<option>Debt Consolidation</option>
<option>Housing Loan</option>
<option>Car Loan</option>
<option>Business Loan</option>
<option>Credit Card</option>
<option>Refinancing</option>
<option>Other</option>

</select>

</div>


<div class="form-group">

<label data-i18n="lblAmt2">Loan Amount (RM)</label>

<input id="applicationAmount" type="number">

</div>


<div class="form-group">

<label data-i18n="lblTenure">Tenure (Months)</label>

<input id="applicationTenure" type="number">

</div>


<div class="form-group">

<label data-i18n="lblBank">Bank / Lender</label>

<input id="applicationBank">

</div>


<div class="form-group">

<label data-i18n="lblRate">Interest Rate (%)</label>

<input id="applicationRate" type="number" step="0.01">

</div>


<div class="form-group">

<label data-i18n="lblInst">Monthly Instalment (RM)</label>

<input id="applicationInstalment" type="number">

</div>


<div class="form-group">

<label data-i18n="lblStat2">Status</label>

<select id="applicationStatus">

<option>New</option>
<option>Submitted</option>
<option>Document Pending</option>
<option>Under Review</option>
<option>Approved</option>
<option>Rejected</option>
<option>Disbursed</option>

</select>

</div>


<div class="form-group">

<label data-i18n="lblAppDate">Application Date</label>

<input id="applicationDate" type="date">

</div>


<div class="form-group full">

<label data-i18n="lblNote2">Notes</label>

<textarea id="applicationNotes"></textarea>

</div>

</div>


<div class="modal-actions">

<button
type="button"
class="btn cancel"
onclick="closeApplicationModal()" data-i18n="btnCancel">

Cancel

</button>

<button class="btn" data-i18n="btnSave">

Save Application

</button>

</div>

</form>

</div>

</div>

</div>

    const lang = langDict[currentLang];

let list =
customers.filter(c => {

let matchSearch =

.toLowerCase()
.includes(search);

let matchStatus =
!filter || c.status === filter;

return matchSearch && matchStatus;

});


let table =

table.innerHTML = `

function addUpdate(id) {
const lang = langDict[currentLang];
let c =
customers.find(x => x.id === id);

let note =
prompt(lang.enterUpdate);

if (!note) return;

let today =
new Date().toLocaleDateString(
"en-GB",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);


c.events =
c.events || [];

c.events.unshift([
today,
note
]);

c.updated = today;

saveData();

openProfile(id);

}
