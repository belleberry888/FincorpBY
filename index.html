
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClientFlow CRM</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
body{background:#f5f7fb;color:#172033}
.container{max-width:1200px;margin:20px auto;padding:0 15px}
header{display:flex;justify-content:space-between;align-items:center;background:#223354;color:#fff;padding:16px 20px;border-radius:10px;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.langBtn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;background:#4864a0;color:white;font-size:14px;margin:0 3px}
.loginWrap{max-width:420px;margin:80px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 2px 12px #00000018}
.loginWrap h2{margin-bottom:24px;text-align:center}
.formRow{margin-bottom:18px}
.formRow label{display:block;margin-bottom:8px}
.formRow input{width:100%;padding:11px;border:1px solid #d6dbe3;border-radius:6px;font-size:16px}
button{cursor:pointer}
#loginBtn{width:100%;padding:12px;background:#223354;color:white;border:none;border-radius:6px;font-size:16px}
.dashboard{display:none}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 1px 8px #00000010}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #e8ebf0;padding:12px;text-align:left}
th{background:#f0f3f9}
.delBtn{padding:6px 10px;background:#dd3333;color:white;border:none;border-radius:4px}
.addForm input,.addForm select{padding:9px;margin:5px;border:1px solid #d6dbe3;border-radius:5px}
#addCustomerBtn{padding:9px 14px;background:#288746;color:white;border:none;border-radius:5px}
.logoutBtn{padding:8px 14px;background:#bb2222;color:white;border:none;border-radius:6px}
.nav{display:flex;gap:10px;margin-bottom:15px}
.nav button{padding:8px 14px;border:none;border-radius:6px;background:#6078ad;color:#fff}
.nav button.active{background:#223354}
.tabPage{display:none}
.tabPage.active{display:block}
</style>
</head>
<body>

<script>
const texts = {
en:{
title:"ClientFlow CRM",
loginTitle:"Staff Login",
username:"Username",
password:"Password",
login:"Login",
dashboard:"Dashboard",
customerList:"Customer List",
addCustomer:"Add New Customer",
name:"Name",
phone:"Phone",
loanType:"Loan Type",
loanAmount:"Loan Amount",
status:"Status",
remark:"Remark",
action:"Action",
delete:"Delete",
confirmDel:"Confirm to delete this customer record?",
logout:"Log out",
pending:"Pending",
approved:"Approved",
reject:"Rejected",
totalCustomer:"Total Customers",
totalLoanSum:"Total Loan Amount"
},
zh:{
title:"客户贷款管理系统",
loginTitle:"员工登录",
username:"账号",
password:"密码",
login:"登录",
dashboard:"仪表盘",
customerList:"客户列表",
addCustomer:"新增客户（贷款资料）",
name:"姓名",
phone:"联系电话",
loanType:"贷款类型",
loanAmount:"贷款金额",
status:"状态",
remark:"备注",
action:"操作",
delete:"删除",
confirmDel:"确定删除这条客户贷款记录吗？",
logout:"退出登录",
pending:"待审核",
approved:"已批准",
reject:"拒绝",
totalCustomer:"客户总数",
totalLoanSum:"贷款总金额"
}
};
let currentLang = "en";
function setLang(lang){
currentLang=lang;
const t=texts[lang];
document.title = t.title;
document.getElementById("loginTitle").innerText = t.loginTitle;
document.getElementById("lblUser").innerText = t.username;
document.getElementById("lblPwd").innerText = t.password;
document.getElementById("loginBtn").innerText = t.login;
document.getElementById("navDash").innerText = t.dashboard;
document.getElementById("navCus").innerText = t.customerList;
document.getElementById("addCusTxt").innerText = t.addCustomer;
document.getElementById("thName").innerText = t.name;
document.getElementById("thPhone").innerText = t.phone;
document.getElementById("thLoanType").innerText = t.loanType;
document.getElementById("thLoanAmt").innerText = t.loanAmount;
document.getElementById("thStatus").innerText = t.status;
document.getElementById("thRemark").innerText = t.remark;
document.getElementById("thAct").innerText = t.action;
document.getElementById("logoutBtn").innerText = t.logout;
document.getElementById("totalCusText").innerText = t.totalCustomer;
document.getElementById("totalLoanText").innerText = t.totalLoanSum;
renderCustomerTable();
calcSummary();
}
</script>

<!-- 登录页面 -->
<div id="loginPage" class="loginWrap">
<h2 id="loginTitle">Staff Login</h2>
<div class="formRow">
<label id="lblUser">Username</label>
<input id="userInput" type="text">
</div>
<div class="formRow">
<label id="lblPwd">Password</label>
<input id="pwdInput" type="password">
</div>
<button id="loginBtn" onclick="doLogin()">Login</button>
</div>

<!-- 主系统 贷款CRM面板 -->
<div id="dashPage" class="container dashboard">
<header>
<h2 id="dashTitle">ClientFlow CRM</h2>
<div>
<button class="langBtn" onclick="setLang('en')">EN</button>
<button class="langBtn" onclick="setLang('zh')">中文</button>
<button id="logoutBtn" class="logoutBtn" onclick="logout()">Log out</button>
</div>
</header>

<div class="nav">
<button id="navDash" class="active" onclick="switchTab('tabDash')">Dashboard</button>
<button id="navCus" onclick="switchTab('tabCustomer')">Customer List</button>
</div>

<!-- 仪表盘 统计 -->
<div id="tabDash" class="tabPage active">
<div class="card">
<h3 id="totalCusText">Total Customers: <span id="countCus">0</span></h3>
<h3 id="totalLoanText">Total Loan Sum: RM <span id="sumLoan">0</span></h3>
</div>
</div>

<!-- 客户&贷款列表 -->
<div id="tabCustomer" class="tabPage">
<div class="card">
<h3 id="addCusTxt">Add New Customer</h3>
<div class="addForm">
<input id="cusName" placeholder="Name">
<input id="cusPhone" placeholder="Phone">
<select id="loanType">
<option>Personal Loan</option>
<option>Business Loan</option>
<option>Property Loan</option>
<option>Car Loan</option>
</select>
<input id="loanAmt" placeholder="Loan Amount RM">
<select id="cusStatus">
<option value="pending">Pending</option>
<option value="approved">Approved</option>
<option value="reject">Rejected</option>
</select>
<input id="cusRemark" placeholder="Remark">
<button id="addCustomerBtn" onclick="addCustomer()">+ Add</button>
</div>
</div>
<div class="card">
<table>
<thead>
<tr>
<th id="thName">Name</th>
<th id="thPhone">Phone</th>
<th id="thLoanType">Loan Type</th>
<th id="thLoanAmt">Loan Amount</th>
<th id="thStatus">Status</th>
<th id="thRemark">Remark</th>
<th id="thAct">Action</th>
</tr>
</thead>
<tbody id="customerTableBody">
</tbody>
</table>
</div>
</div>
</div>

<script>
//员工账号
const staffUser = "staff";
const staffPwd = "123456";
let customerList = [];

//登录
function doLogin(){
const u = document.getElementById("userInput").value.trim();
const p = document.getElementById("pwdInput").value.trim();
if(u === staffUser && p === staffPwd){
document.getElementById("loginPage").style.display="none";
document.getElementById("dashPage").style.display="block";
calcSummary();
renderCustomerTable();
}else{
alert(currentLang==="zh"?"账号或密码错误":"Wrong username or password");
}
}
//退出
function logout(){
document.getElementById("loginPage").style.display="block";
document.getElementById("dashPage").style.display="none";
document.getElementById("userInput").value="";
document.getElementById("pwdInput").value="";
}

//切换页面标签
function switchTab(tabId){
document.querySelectorAll(".tabPage").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
document.getElementById(tabId).classList.add("active");
event.target.classList.add("active");
}

//新增客户贷款资料
function addCustomer(){
const name = document.getElementById("cusName").value.trim();
const phone = document.getElementById("cusPhone").value.trim();
const loanType = document.getElementById("loanType").value;
const loanAmt = Number(document.getElementById("loanAmt").value);
const status = document.getElementById("cusStatus").value;
const remark = document.getElementById("cusRemark").value.trim();
if(!name){
alert(currentLang==="zh"?"姓名必填":"Name is required");
return;
}
customerList.push({name,phone,loanType,loanAmt,status,remark,id:Date.now()});
//清空输入框
document.getElementById("cusName").value="";
document.getElementById("cusPhone").value="";
document.getElementById("loanAmt").value="";
document.getElementById("cusRemark").value="";
renderCustomerTable();
calcSummary();
}

//渲染客户表格
function renderCustomerTable(){
const tbody = document.getElementById("customerTableBody");
tbody.innerHTML="";
const t=texts[currentLang];
customerList.forEach(item=>{
let statusText;
if(item.status==="pending") statusText = t.pending;
else if(item.status==="approved") statusText = t.approved;
else statusText = t.reject;

const tr = document.createElement("tr");
tr.innerHTML = `
<td>${item.name}</td>
<td>${item.phone}</td>
<td>${item.loanType}</td>
<td>RM ${item.loanAmt}</td>
<td>${statusText}</td>
<td>${item.remark}</td>
<td><button class="delBtn" onclick="deleteCustomer(${item.id})">${t.delete}</button></td>
`;
tbody.appendChild(tr);
})
}

// 删除客户（带确认弹窗）
function deleteCustomer(id){
if(confirm(texts[currentLang].confirmDel)){
customerList = customerList.filter(c=>c.id !== id);
renderCustomerTable();
calcSummary();
}
}

//仪表盘统计总数、贷款总额
function calcSummary(){
document.getElementById("countCus").innerText = customerList.length;
let total = 0;
customerList.forEach(i=> total += Number(i.loanAmt));
document.getElementById("sumLoan").innerText = total;
}
</script>
</body>
</html>
